<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DeFi Guardian - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white dark:bg-gray-900 rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-6">Create Your Account</h2>

    <form action="home.html" method="POST" class="space-y-5">
     
      <div>
        <label for="name" class="block text-gray-700 dark:text-gray-200">Full Name</label>
        <input type="text" id="name" name="name" required
          class="w-full px-4 py-2 mt-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-700 dark:text-white"/>
      </div>

     
      <div>
        <label for="email" class="block text-gray-700 dark:text-gray-200">Email Address</label>
        <input type="email" id="email" name="email" required
          class="w-full px-4 py-2 mt-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-700 dark:text-white"/>
      </div>

    
      <div>
        <label for="password" class="block text-gray-700 dark:text-gray-200">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full px-4 py-2 mt-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-700 dark:text-white"/>
      </div>

    
      <div>
        <label for="confirm-password" class="block text-gray-700 dark:text-gray-200">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required
          class="w-full px-4 py-2 mt-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-700 dark:text-white"/>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-200">
        Sign Up
      </button> 
    </form>

    <p class="text-center text-gray-600 dark:text-gray-400 mt-4 text-sm">
      Already have an account?
      <a href="#" class="text-blue-500 hover:underline">Log in</a>
    </p>
  </div>

  <script>
    const form = document.querySelector('form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
  
      const name = form.name.value;
      const email = form.email.value;
      const password = form.password.value;
      const confirmPassword = form["confirm-password"].value;
  
      try {
        const res = await fetch('http://localhost:3000/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirmPassword }),
        });
  
        const data = await res.json();
  
        if (res.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = 'home.html'; // redirect on success
        } else {
          alert(data.error);
        }
      } catch (err) {
        console.error(err);
        alert('Signup failed');
      }
    });
  </script>
  

</body>
</html>
